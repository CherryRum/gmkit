name: SM9 Native

on:
  push:
    paths:
      - 'packages/java/gmkit-sm9/**'
      - 'packages/java/gmkit-sm9-native-*/**'
      - 'packages/java/pom.xml'
      - 'scripts/sm9-native.ps1'
      - '.github/workflows/sm9-native.yml'
  pull_request:
    paths:
      - 'packages/java/gmkit-sm9/**'
      - 'packages/java/gmkit-sm9-native-*/**'
      - 'packages/java/pom.xml'
      - 'scripts/sm9-native.ps1'
      - '.github/workflows/sm9-native.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GMSSL_REF: v3.1.1

jobs:
  native-test:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            generator: ''
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            generator: ''
          - os: macos-13
            platform: darwin-x86_64
            generator: ''
          - os: macos-14
            platform: darwin-aarch64
            generator: ''
          - os: windows-latest
            platform: windows-x86_64
            generator: 'Visual Studio 17 2022'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            packages/java/pom.xml
            packages/java/gmkit-sm9/pom.xml

      - name: Build and test SM9 JNI runtime
        shell: pwsh
        run: |
          $scriptArgs = @{
            Platform = '${{ matrix.platform }}'
            GmsslRef = $env:GMSSL_REF
            Stage = $true
            PackageRuntime = $true
            Test = $true
          }
          if ('${{ matrix.generator }}') {
            $scriptArgs.Generator = '${{ matrix.generator }}'
          }
          ./scripts/sm9-native.ps1 @scriptArgs
