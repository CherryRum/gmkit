name: SM9 Native

on:
  push:
    paths:
      - 'packages/java/gmkit-sm9/**'
      - 'packages/java/gmkit-sm9-native-*/**'
      - 'packages/java/pom.xml'
      - '.github/workflows/sm9-native.yml'
  pull_request:
    paths:
      - 'packages/java/gmkit-sm9/**'
      - 'packages/java/gmkit-sm9-native-*/**'
      - 'packages/java/pom.xml'
      - '.github/workflows/sm9-native.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GMSSL_REF: v3.1.1

jobs:
  native-test:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            bridge: libgmkitsm9.so
            gmssl: libgmssl.so.3
          - os: macos-14
            platform: darwin-aarch64
            bridge: libgmkitsm9.dylib
            gmssl: libgmssl.3.dylib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            packages/java/pom.xml
            packages/java/gmkit-sm9/pom.xml
      - name: Build GmSSL
        run: |
          git clone --depth 1 --branch "$GMSSL_REF" https://github.com/guanzhi/GmSSL.git gmssl-src
          cmake -S gmssl-src -B gmssl-build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
          cmake --build gmssl-build --parallel 2
          sudo cmake --install gmssl-build
      - name: Build JNI bridge
        run: mvn -f packages/java/pom.xml -B -ntp -pl gmkit-sm9 -Pnative-build -Dgmssl.root=/usr/local process-classes
      - name: Stage native runtime for tests
        shell: bash
        run: |
          dst="packages/java/gmkit-sm9/src/test/resources/native/${{ matrix.platform }}"
          mkdir -p "$dst"
          find packages/java/gmkit-sm9/target/native-build -name '${{ matrix.bridge }}' -exec cp {} "$dst/" \;
          cp "/usr/local/lib/${{ matrix.gmssl }}" "$dst/"
      - name: Run SM9 native tests
        run: mvn -f packages/java/pom.xml -B -ntp -pl gmkit-sm9 test
