name: Publish to NPM

# 当推送 ts-v* 标签时触发；ts- 前缀避免与 Java 端 release 标签冲突
# Triggered on ts-v* tags; ts- prefix prevents collision with Java release tags
on:
  push:
    tags:
      - 'ts-v*'

defaults:
  run:
    working-directory: ts

jobs:
  publish:
    name: Publish Package to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: ts/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify version match
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/ts-v}
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "Git tag version: ts-v$TAG_VERSION"
          echo "package.json version: $PACKAGE_VERSION"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "❌ Version mismatch — tag ts-v$TAG_VERSION vs package.json $PACKAGE_VERSION"
            exit 1
          fi
          echo "✅ Versions match: $PACKAGE_VERSION"
      - name: Publish to NPM
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}