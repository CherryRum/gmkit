name: Deploy VuePress Site

on:
  push:
    branches: [ main ]
    paths:
      - 'ts/docs/**'
      - 'ts/src/**'
      - '.github/workflows/deploy-docs.yml'
      - '.github/scripts/purge_edgeone.py'
  pull_request:
    paths:
      - 'ts/docs/**'
      - 'ts/src/**'

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # keep history so VuePress git plugin shows per-file contributors/last-updated

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ts/docs/package-lock.json

      - name: Install Dependencies (docs package)
        working-directory: ./ts/docs
        run: npm i

      - name: Build VuePress
        working-directory: ./ts/docs
        run: npm run build

      - name: Deploy to HK (Main Origin)
        if: github.event_name == 'push'
        uses: burnett01/rsync-deployments@7.1.0
        with:
          switches: -az --delete
          path: ts/docs/.vuepress/dist/
          remote_path: /home/gmkit-site/www/
          remote_user: ${{ secrets.USER }}
          remote_host: ${{ secrets.HK_HOST }}
          remote_key: ${{ secrets.SSH_KEY }}

      - name: Deploy to CN (Mirror Origin)
        if: github.event_name == 'push'
        uses: burnett01/rsync-deployments@7.1.0
        with:
          switches: -az --delete
          path: ts/docs/.vuepress/dist/
          remote_path: /home/gmkit-site/www/
          remote_user: ${{ secrets.USER }}
          remote_host: ${{ secrets.CN_HOST }}
          remote_key: ${{ secrets.SSH_KEY }}

      - name: Purge EdgeOne CDN Cache (Domestic - CN)
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIN_INTERVAL_HOURS: 1
        run: |
          python3 .github/scripts/purge_edgeone.py \
            "${{ secrets.TENCENT_SECRET_ID_CN }}" \
            "${{ secrets.TENCENT_SECRET_KEY_CN }}" \
            "${{ secrets.EDGEONE_ZONE_ID_CN }}" \
            "gmkit.oldletter.cn" \
            --site-type=cn

      - name: Purge EdgeOne CDN Cache (International - Global)
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIN_INTERVAL_HOURS: 1
        run: |
          python3 .github/scripts/purge_edgeone.py \
            "${{ secrets.TENCENT_SECRET_ID_GLOBAL }}" \
            "${{ secrets.TENCENT_SECRET_KEY_GLOBAL }}" \
            "${{ secrets.EDGEONE_ZONE_ID_GLOBAL }}" \
            "gmkit.cn,www.gmkit.cn" \
            --site-type=intl