name: Docs

on:
  push:
    paths:
      - 'packages/ts-docs/**'
      - 'packages/ts/**'
      - 'apps/demo-vue/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'packages/ts-docs/**'
      - 'packages/ts/**'
      - 'apps/demo-vue/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run docs:build
      - run: npm run build -w apps/demo-vue
