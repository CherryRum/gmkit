name: Docs

on:
  push:
    paths:
      - 'packages/ts-docs/**'
      - 'packages/ts/**'
      - 'apps/gmkit-studio/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'packages/ts-docs/**'
      - 'packages/ts/**'
      - 'apps/gmkit-studio/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Repair Rollup optional native package
        run: npm install --no-save --package-lock=false @rollup/rollup-linux-x64-gnu@$(node -p "require('./node_modules/rollup/package.json').version")
      - run: npm run docs:build
      - run: npm run build -w packages/ts
      - run: npm run build -w apps/gmkit-studio
