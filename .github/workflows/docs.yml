name: Docs

on:
  push:
    paths:
      - 'packages/ts-docs/**'
      - 'packages/ts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'packages/ts-docs/**'
      - 'packages/ts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/ts-docs/examples/go/go.mod
          cache-dependency-path: packages/ts-docs/examples/go/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: packages/ts-docs/examples/hutool/pom.xml
      - run: npm ci
      - name: Repair Rollup optional native package
        run: npm install --no-save --package-lock=false @rollup/rollup-linux-x64-gnu@$(node -p "require('./node_modules/rollup/package.json').version")
      - run: npm run build -w packages/ts
      - run: npm run docs:check
      - run: npm run docs:test-examples
      - run: npm run docs:build
