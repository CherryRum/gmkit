name: CI

on:
  push:
    paths:
      - 'packages/ts/**'
      - 'packages/java/**'
      - 'packages/ts-docs/**'
      - 'apps/gmkit-studio/**'
      - 'vectors/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'packages/ts/**'
      - 'packages/java/**'
      - 'packages/ts-docs/**'
      - 'apps/gmkit-studio/**'
      - 'vectors/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    name: TypeScript / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18.x, 20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Repair Rollup optional native package
        run: npm install --no-save --package-lock=false @rollup/rollup-linux-x64-gnu@$(node -p "require('./node_modules/rollup/package.json').version")
      - run: npm run type-check -w packages/ts
      - run: npm test -w packages/ts
      - run: npm run build -w packages/ts
      - run: npm run test:package -w packages/ts

  java:
    name: Java / JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [8, 11, 17, 21, 25]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: |
            packages/java/pom.xml
            packages/java/gmkit/pom.xml
            packages/java/gmkit-sm9/pom.xml
            packages/java/gmkit-bom/pom.xml
            packages/java/gmkit-benchmarks/pom.xml
      - run: mvn -f packages/java/pom.xml -B -ntp test
