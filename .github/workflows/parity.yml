name: Parity

on:
  push:
    paths:
      - 'packages/ts/**'
      - 'packages/java/**'
      - 'vectors/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/parity.yml'
  pull_request:
    paths:
      - 'packages/ts/**'
      - 'packages/java/**'
      - 'vectors/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            packages/java/pom.xml
            packages/java/gmkit/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Work around npm optional dependency bug (rollup native binary)
        run: npm install --no-save @rollup/rollup-linux-x64-gnu
      - name: Java interop compliance
        run: mvn -f packages/java/pom.xml -B -ntp -pl gmkit -Dtest=cn.gmkit.InteropComplianceTest test
      - name: TypeScript interop compliance
        working-directory: packages/ts
        run: npx vitest run test/interop-compliance.test.ts
