name: Parity

# 跨语言互通向量校验。两栈各自从 /vectors/interop.json 加载向量并跑
# InteropComplianceTest（Java）/ interop-compliance.test.ts（TS）。
# 任一栈对相同输入产生不同字节级输出 -> 红。
#
# 当前覆盖：SM3 digest（10/10 通过）。
# 进行中：SM4 ECB/PKCS7（见 CHANGELOG "Known divergence"），audit Section D
# 修复后将自动启用更多算法覆盖。
#
# 触发：vectors/、java/、ts/ 改动均触发；workflow_dispatch 手动可触发。

on:
  push:
    branches: [ main ]
    paths:
      - 'vectors/**'
      - 'java/**'
      - 'ts/**'
      - '.github/workflows/parity.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'vectors/**'
      - 'java/**'
      - 'ts/**'
      - '.github/workflows/parity.yml'
  workflow_dispatch:

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java-interop:
    name: Java interop vs shared vectors
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: |
            java/pom.xml
            java/gmkit/pom.xml
      - name: Run InteropComplianceTest
        run: mvn -B -ntp -pl gmkit -Dtest=InteropComplianceTest test

  ts-interop:
    name: TS interop vs shared vectors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: ts/package-lock.json
      - run: npm ci
      - name: Run interop-compliance suite
        run: npx vitest run test/interop-compliance.test.ts