name: Java Release Verify

on:
  workflow_dispatch:
  push:
    tags:
      - "java-v*"

concurrency:
  group: java-release-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: java

jobs:
  verify:
    name: Verify release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: |
            java/pom.xml
            java/gmkit/pom.xml
            java/gmkit-sm9/pom.xml

      - name: Verify release build
        run: mvn -B -ntp -Prelease -Dgpg.skip=true -DskipTests verify