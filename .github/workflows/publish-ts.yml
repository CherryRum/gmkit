name: Publish TypeScript

on:
  push:
    tags:
      - 'ts-v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use trusted-publishing npm CLI
        run: npm install --global npm@12.0.1
      - run: npm ci
      - name: Repair Rollup optional native package
        run: npm install --no-save --package-lock=false @rollup/rollup-linux-x64-gnu@$(node -p "require('./node_modules/rollup/package.json').version")
      - name: Check release version
        shell: bash
        run: |
          package_version="$(node -p 'require("./packages/ts/package.json").version')"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag_version="${GITHUB_REF_NAME#ts-v}"
            test "$tag_version" = "$package_version"
          fi
      - run: npm run type-check -w packages/ts
      - run: npm test -w packages/ts
      - run: npm run lint -w packages/ts
      - run: npm run build -w packages/ts
      - run: npm run audit:pack -w packages/ts
      - name: Publish with npm trusted publishing
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ts-v')
        working-directory: packages/ts
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#ts-v}"
          npm_tag="latest"
          if [[ "$tag_version" == *-* ]]; then
            npm_tag="preview"
          fi
          npm publish --provenance --access public --tag "$npm_tag"
