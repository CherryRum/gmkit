name: Publish TypeScript

on:
  push:
    tags:
      - 'ts-v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Repair Rollup optional native package
        run: npm install --no-save --package-lock=false @rollup/rollup-linux-x64-gnu@$(node -p "require('./node_modules/rollup/package.json').version")
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/ts-v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF#refs/tags/ts-v}"
          pkg_version="$(node -p 'require("./packages/ts/package.json").version')"
          test "$tag_version" = "$pkg_version"
      - run: npm run type-check -w packages/ts
      - run: npm test -w packages/ts
      - run: npm run build -w packages/ts
      - run: npm run audit:pack -w packages/ts
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/ts-v')
        working-directory: packages/ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          tag_version="${GITHUB_REF#refs/tags/ts-v}"
          npm_tag="latest"
          if [[ "$tag_version" == *-* ]]; then
            npm_tag="preview"
          fi
          npm publish --provenance --access public --tag "$npm_tag"
